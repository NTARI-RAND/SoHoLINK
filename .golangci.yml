# Run locally: golangci-lint run ./...
# Whole-program reachability is a separate check: deadcode -test ./...
# The removed golangci-lint deadcode linter does not provide that analysis;
# unused checks unused declarations within packages, not binary wiring.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
  settings:
    staticcheck:
      checks: ["all"]
  exclusions:
    rules:
      # Preserve the existing exception for generated mock methods.
      - path: "_mock\\.go$"
        linters: [unused]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
